name: KAIST live test

on:
  schedule:
    # Monday at 06:17 Korea Standard Time.
    - cron: "17 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-test:
    name: Test KAIST menu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Test the live KAIST menu
        run: uv run pytest integration/test_kaist_live.py
